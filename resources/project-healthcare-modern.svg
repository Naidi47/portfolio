<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Multimodal Healthcare</title><desc id="desc">Image + patient metadata fusion with interpretable prediction</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171629"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#39a9ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/><rect width="1200" height="680" rx="28" fill="url(#grid)"/>
<circle cx="1040" cy="80" r="190" fill="#4da3ff" opacity=".07"/><circle cx="170" cy="610" r="180" fill="#8a7dff" opacity=".07"/>
<text x="58" y="62" fill="#55a9ff" font-family="monospace" font-size="20" letter-spacing="4">MULTIMODAL HEALTHCARE</text>

<g font-family="Arial,sans-serif">
 <g fill="#151b2a" stroke="#2b3955"><rect x="55" y="135" width="245" height="210" rx="20"/><rect x="340" y="135" width="220" height="210" rx="20"/><rect x="600" y="135" width="220" height="210" rx="20"/><rect x="860" y="135" width="280" height="210" rx="20"/></g>
 <text x="177" y="178" fill="#f5f7fb" font-size="22" text-anchor="middle">Dermatoscopic Image</text>
 <circle cx="177" cy="250" r="60" fill="#3b2935" stroke="#55a9ff" stroke-width="4"/><path d="M145 245c25-50 88-20 65 22-20 36-60 28-65-22z" fill="#6b4650"/>
 <text x="450" y="178" fill="#f5f7fb" font-size="22" text-anchor="middle">EfficientNet-B0</text><text x="450" y="220" fill="#8e9ab0" font-size="16" text-anchor="middle">visual embeddings</text><rect x="390" y="252" width="120" height="22" rx="11" fill="#273451"/><rect x="390" y="252" width="92" height="22" rx="11" fill="url(#blue)"/>
 <text x="710" y="178" fill="#f5f7fb" font-size="22" text-anchor="middle">Metadata Fusion</text><text x="710" y="218" fill="#8e9ab0" font-size="16" text-anchor="middle">age • sex • lesion data</text><circle cx="710" cy="270" r="38" fill="#18253a" stroke="#8a7dff" stroke-width="4"/><text x="710" y="277" fill="#f5f7fb" font-size="18" text-anchor="middle">FUSE</text>
 <text x="1000" y="178" fill="#f5f7fb" font-size="22" text-anchor="middle">7-Class Prediction</text><g fill="#55a9ff"><rect x="910" y="215" width="190" height="15" rx="7"/><rect x="910" y="245" width="145" height="15" rx="7"/><rect x="910" y="275" width="165" height="15" rx="7"/><rect x="910" y="305" width="105" height="15" rx="7"/></g>
 <g stroke="url(#blue)" stroke-width="6" fill="none" filter="url(#glow)"><path d="M300 240H335"/><path d="M560 240H595"/><path d="M820 240H855"/></g>
 <rect x="205" y="420" width="790" height="105" rx="20" fill="#101827" stroke="#2b3955"/><text x="600" y="460" fill="#55a9ff" font-size="17" text-anchor="middle" font-family="monospace">INTERPRETABILITY</text><text x="600" y="495" fill="#b8c1d2" font-size="19" text-anchor="middle">Grad-CAM + SHAP → explainable model decisions</text>
</g>
</svg>