<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Multi-Agent Research</title><desc id="desc">Specialized agents collaborate to research, verify and synthesize</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171629"/></linearGradient>
 <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#39a9ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/><rect width="1200" height="680" rx="28" fill="url(#grid)"/>
<circle cx="1040" cy="80" r="190" fill="#4da3ff" opacity=".07"/><circle cx="170" cy="610" r="180" fill="#8a7dff" opacity=".07"/>
<text x="58" y="62" fill="#55a9ff" font-family="monospace" font-size="20" letter-spacing="4">MULTI-AGENT RESEARCH</text>

<g font-family="Arial,sans-serif">
 <g fill="#151b2a" stroke="#2b3955"><rect x="70" y="190" width="190" height="130" rx="18"/><rect x="355" y="100" width="190" height="130" rx="18"/><rect x="355" y="280" width="190" height="130" rx="18"/><rect x="640" y="100" width="190" height="130" rx="18"/><rect x="640" y="280" width="190" height="130" rx="18"/><rect x="925" y="190" width="190" height="130" rx="18"/></g>
 <g fill="#f5f7fb" font-size="21" text-anchor="middle"><text x="165" y="245">User Goal</text><text x="450" y="155">Planner</text><text x="450" y="335">Researcher</text><text x="735" y="155">Analyst</text><text x="735" y="335">Verifier</text><text x="1020" y="245">Report</text></g>
 <g fill="#8e9ab0" font-size="14" text-anchor="middle"><text x="165" y="272">task → objectives</text><text x="450" y="184">routes work</text><text x="450" y="364">finds evidence</text><text x="735" y="184">synthesizes</text><text x="735" y="364">checks claims</text><text x="1020" y="272">structured output</text></g>
 <g stroke="url(#blue)" stroke-width="5" fill="none" filter="url(#glow)"><path d="M260 255H350"/><path d="M450 230V275"/><path d="M545 165H635"/><path d="M545 345H635"/><path d="M830 165H900V230"/><path d="M830 345H900V280"/></g>
 <circle cx="600" cy="255" r="45" fill="#121c2e" stroke="#55a9ff" stroke-width="4"/><text x="600" y="262" fill="#55a9ff" font-size="18" text-anchor="middle">STATE</text>
</g>
</svg>